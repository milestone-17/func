name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每日美股收盘后自动刷新行情数据 (UTC 22:17 ≈ 北京时间次日 06:17)
    - cron: '17 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci || npm install
      - run: node scripts/gen-icons.cjs
      - run: node scripts/fetch-nasdaq.cjs
      - run: npm run test -- --run
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
