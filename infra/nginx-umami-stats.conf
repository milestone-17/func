# umami /stats 反代片段（milestoneluo.top）
# 使用：插入 sites-available/snowlope 的 80 与 443 两个 server 块中 location / 之前
# 依赖：umami.service 监听 127.0.0.1:3001（BASE_PATH=/stats）
# 说明：线上 80/443 两个 server 块中该片段内容完全相同，故只保留一份，两处插入
location /stats {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
